version: '3.8'

# App migrada a otro proyecto. Aquí solo queda un nginx que redirige
# cualquier ruta a http://89.167.20.163:8080/salas/reservar.
# Backend y base de datos quedan apagados (sin api ni db).

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: salas_frontend
    ports:
      - '8089:80' # El ÚNICO puerto expuesto hacia tu VPN o hacia internet
    restart: unless-stopped
