<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="refresh" content="3;url=http://89.167.20.163:8080/salas/reservar" />
  <title>Esta página se ha movido</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 460px;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 12px;
      color: #f8fafc;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      margin: 0 0 24px;
      color: #94a3b8;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 24px;
      border: 4px solid rgba(148, 163, 184, 0.25);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    a {
      color: #38bdf8;
      text-decoration: none;
      font-weight: 600;
    }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" role="status" aria-label="Redirigiendo"></div>
    <h1>Esta página se ha movido</h1>
    <p>
      El sistema de reservas de salas cambió de dirección.<br />
      Te estamos redirigiendo automáticamente en unos segundos&hellip;
    </p>
    <p>
      Si no sucede nada,
      <a href="http://89.167.20.163:8080/salas/reservar">haz clic aquí para continuar</a>.
    </p>
  </div>

  <!-- Respaldo por si el navegador ignora el meta refresh -->
  <script>
    setTimeout(function () {
      window.location.replace('http://89.167.20.163:8080/salas/reservar');
    }, 3000);
  </script>
</body>
</html>
