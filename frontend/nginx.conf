server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # App migrada: cualquier ruta muestra la página de aviso, que redirige
    # sola al nuevo sitio tras 3 segundos. No se sirve la SPA ni se hace
    # proxy al backend (apagado).
    location / {
        try_files /index.html =404;
    }
}
